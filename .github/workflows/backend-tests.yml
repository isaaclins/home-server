name: Backend Tests

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: homeserver
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || exit 1" \
          --health-interval=10s \
          --health-timeout=5s \
          --health-retries=10

    env:
      # Spring profile for CI
      SPRING_PROFILES_ACTIVE: ci

      # Database configuration (override H2 defaults in application-ci.properties)
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: homeserver
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/homeserver
      SPRING_DATASOURCE_USERNAME: app_user
      SPRING_DATASOURCE_PASSWORD: app_password
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SPRING_JPA_SHOW_SQL: true

      # App configuration needed during CI
      JWT_SECRET: ci_test_jwt_secret_please_replace
      JWT_EXPIRATION: 86400000
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Ensure MySQL client is installed
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Wait for MySQL to be ready
        env:
          MYSQL_PWD: ${{ env.MYSQL_ROOT_PASSWORD }}
        shell: bash
        run: |
          for i in {1..60}; do
            if mysql -h 127.0.0.1 -u root -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL is ready"; exit 0; fi
            echo "Waiting for MySQL ($i/60)..."; sleep 2;
          done
          echo "MySQL did not become ready in time" >&2; exit 1

      - name: Setup MySQL user (compatible with MySQL 8.0 and 8.4+)
        env:
          MYSQL_PWD: ${{ env.MYSQL_ROOT_PASSWORD }}
        shell: bash
        run: |
          echo "Setting up MySQL user..."
          if mysql -h 127.0.0.1 -u root -Nse "SELECT 1 FROM information_schema.plugins WHERE PLUGIN_NAME='mysql_native_password'" | grep -q 1; then
            IDENT="IDENTIFIED WITH mysql_native_password BY '${SPRING_DATASOURCE_PASSWORD}'"
          else
            IDENT="IDENTIFIED BY '${SPRING_DATASOURCE_PASSWORD}'"
          fi
          mysql -h 127.0.0.1 -u root -e "CREATE USER IF NOT EXISTS '${SPRING_DATASOURCE_USERNAME}'@'%' ${IDENT}; GRANT ALL PRIVILEGES ON \`${MYSQL_DATABASE}\`.* TO '${SPRING_DATASOURCE_USERNAME}'@'%'; FLUSH PRIVILEGES;"

      - name: Make CI scripts executable
        run: |
          chmod +x ./run-test-ci.sh
          chmod +x ./run-test.sh

      - name: Run CI tests
        shell: bash
        run: ./run-test-ci.sh


